	<script>
		(function initParticles() {
			function getThemeColors() {
				const isLight = document.body.classList.contains('light-mode');
				const styles = getComputedStyle(document.body);
				let bg = (styles.getPropertyValue('--bg-color') || '').trim();
				if (!bg) {
					bg = isLight ? '#ffe3ec' : '#1e1433';
				}
				const particle = isLight ? '#000000' : '#ffffff';
				return { bg, particle };
			}

			function loadParticles() {
				const colors = getThemeColors();
				if (!window.particlesJS) return;
				particlesJS('particles-js', {
					particles: {
						number: { value: 80, density: { enable: true, value_area: 800 } },
						color: { value: colors.particle },
						shape: { type: 'circle' },
						opacity: { value: 0.6, random: false },
						size: { value: 3, random: true },
						line_linked: { enable: true, distance: 150, color: colors.particle, opacity: 0.3, width: 1 },
						move: { enable: true, speed: 2, direction: 'none', out_mode: 'out' }
					},
					interactivity: {
						detect_on: 'canvas',
						events: { onhover: { enable: true, mode: 'repulse' }, onclick: { enable: true, mode: 'push' }, resize: true },
						modes: { repulse: { distance: 100, duration: 0.4 }, push: { particles_nb: 4 } }
					},
					retina_detect: true
				});
				document.getElementById('particles-js').style.backgroundColor = colors.bg;
			}

			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', loadParticles);
			} else {
				loadParticles();
			}

			window.refreshParticlesForTheme = function() {
				const container = document.getElementById('particles-js');
				if (!container) return;
				container.innerHTML = '';
				loadParticles();
			};
		})();
	</script>
